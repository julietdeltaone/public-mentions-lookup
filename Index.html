<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Mentions Lookup</title>
<style>
:root{color-scheme:dark;--text:#eff4ff;--muted:#aab7cc;--line:rgba(215,230,255,.15);--accent:#b7d9ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:var(--text);background:#080c14}
body{background:radial-gradient(ellipse at 15% 0%,#1c304c 0%,transparent 55%),radial-gradient(ellipse at 100% 100%,#202136 0%,transparent 50%),#080c14}
button,input,a{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}
button{cursor:pointer;color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:16px;min-height:50px;padding:12px 18px;font-size:17px}
button:active{background:rgba(174,210,255,.2)}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:20px 24px 14px;gap:16px;max-width:1500px;margin:auto}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:18px;height:58px}
.brand{display:flex;align-items:center;gap:14px}.mark{width:42px;height:42px;border:1px solid #83a1c7;border-radius:14px;display:grid;place-items:center;font-size:26px;color:var(--accent);background:linear-gradient(145deg,#314964,#142236)}
h1{font-size:24px;letter-spacing:-.6px;margin:0 0 5px}p{margin:0}header p,.subtle{font-size:15px;color:var(--muted)}
main{display:grid;grid-template-columns:296px minmax(0,1fr);gap:18px;flex:1;min-height:0}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:24px;box-shadow:inset 0 1px rgba(255,255,255,.06),0 18px 50px #0003;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.search{padding:20px;overflow:auto;min-height:0}form{display:flex;flex-direction:column;gap:14px}label{display:block;font-size:16px;color:#cbd7e8;margin-bottom:8px}
input{width:100%;height:52px;background:#090f1c88;color:white;border:1px solid #42516a;border-radius:13px;padding:0 14px;font-size:18px;min-width:0}input::placeholder{color:#8797ad}
.primary{color:#102139;background:linear-gradient(135deg,#d5eaff,#a8cbf5);font-weight:bold;border-color:#d5eaff;margin-top:4px;min-height:54px}.primary:active{background:#8bb7ef}
.hint{font-size:15px;line-height:1.45;color:var(--muted)}
.results{display:flex;flex-direction:column;min-height:0;padding:20px;gap:14px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}h2{font-size:20px;margin:0}.result-head span{font-size:15px;color:var(--accent)}
.stage{flex:1;min-height:0;position:relative}.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:16px}.orb{width:70px;height:70px;border:1px solid #597395;border-radius:23px;background:linear-gradient(135deg,#35547477,#14223877);box-shadow:inset 0 1px #b8d9ff33;display:grid;place-items:center;color:#c7e1ff;font-size:34px}.empty h3{font-size:25px;font-weight:500;margin:0}.empty p{font-size:17px;color:var(--muted);line-height:1.5;max-width:390px}
.cards{height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px}.card{text-align:left;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:5px;min-height:0;border-radius:16px;overflow:hidden;background:linear-gradient(120deg,#ccdfff0c,#ccdfff03)}
.category{color:#a6c9f4;font-size:15px}.value{font-size:18px;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.date{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{flex:none;display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:20px;color:var(--muted)}
.spin{animation:pulse 1.3s ease-in-out infinite}@keyframes pulse{50%{opacity:.4;transform:scale(.94)}}
.overlay{position:fixed;inset:0;z-index:10;background:#030711dc;padding:20px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px)}[hidden]{display:none!important}
.dialog{width:min(850px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;padding:22px;gap:16px;background:#131e30}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.dialog-body{overflow:auto;min-height:0;overscroll-behavior:contain;font-size:18px;line-height:1.5}.dialog-body h3{font-size:26px;line-height:1.2;margin:0 0 16px}.dialog-body p{margin:10px 0}.dialog-body small{display:block;color:var(--muted);font-size:15px}.source{display:block;color:#c9e2ff;border:1px solid var(--line);border-radius:13px;padding:13px 16px;min-height:50px;margin-top:10px;overflow-wrap:anywhere;text-decoration:none}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none}.nav span{font-size:16px;color:var(--muted)}iframe{width:100%;height:160px;border:0;background:white;border-radius:12px;margin-top:16px}
@media(max-width:700px){.app{padding:14px;gap:12px}header{height:auto;min-height:58px}h1{font-size:20px}header p{display:none}.mark{display:none}main{display:flex;flex-direction:column;overflow:auto}.search{flex:none;padding:16px}.results{min-height:440px;flex:none}.cards{min-height:330px}footer{font-size:12px}.dialog{padding:16px}}
@media(max-height:520px) and (min-width:701px){.app{padding:10px 18px;gap:10px}header{height:44px}.search,.results{padding:14px}form{gap:9px}label{margin-bottom:5px}input{height:46px}.hint{font-size:14px}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header><div class="brand"><div class="mark" aria-hidden="true">⌕</div><div><h1>Public Mentions</h1><p>A little context. A clearer match.</p></div></div><button id="reset" type="button">New search</button></header>
  <main>
    <section class="search glass" aria-label="Search inputs">
      <form id="form">
        <div><label for="name">Full name</label><input id="name" placeholder="First and last name" maxlength="120" required autocomplete="off"></div>
        <div><label for="school">School</label><input id="school" placeholder="College or university" maxlength="120" autocomplete="off"></div>
        <div><label for="hometown">Hometown</label><input id="hometown" placeholder="Town, state" maxlength="120" autocomplete="off"></div>
        <button class="primary" id="search" type="submit">Find public mentions</button>
        <p class="hint">Add a school or hometown.<br>Both help narrow the match.</p>
      </form>
    </section>
    <section class="results glass" aria-label="Search results" aria-busy="false">
      <div class="result-head"><h2 id="heading">Public record, small details.</h2><span id="count">Up to 6 facts</span></div>
      <div class="stage" id="stage" aria-live="polite"></div>
      <p class="subtle" id="note">Dated mentions, with sources you can open.</p>
    </section>
  </main>
  <footer><span>Public Mentions Lookup</span><span>Source-supported ≠ independently verified</span></footer>
</div>
<div class="overlay" id="overlay" hidden>
  <section class="dialog glass" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="dialog-head"><h2 id="detailTitle">Source details</h2><button id="close" type="button">Close</button></div>
    <div class="dialog-body" id="detail"></div>
    <div class="nav"><button id="previous" type="button">Previous</button><span id="position"></span><button id="next" type="button">Next</button></div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
let facts = [], searchHtml = '', selected = 0, busy = false, timer, started, lastFocus;
function node(tag, text, cls) { const n = document.createElement(tag); if(text !== undefined) n.textContent = text; if(cls) n.className = cls; return n; }
function empty(title, message, loading) {
  const box = node('div', undefined, 'empty');
  box.append(node('div', loading ? '◌' : '⌕', 'orb' + (loading ? ' spin' : '')), node('h3', title), node('p', message));
  $('stage').replaceChildren(box);
}
function setBusy(value) {
  busy = value; $('search').disabled = value; $('reset').disabled = value;
  ['name','school','hometown'].forEach(id => $(id).disabled = value);
  document.querySelector('.results').setAttribute('aria-busy', String(value));
}
function finish() { clearInterval(timer); setBusy(false); }
function fail(error) {
  finish(); $('heading').textContent = 'Search unavailable'; $('count').textContent = '';
  empty('Let’s try that again.', String(error.message || error).replace(/^Error:\s*/, ''));
  $('note').textContent = 'No result was counted. Your inputs are still here.';
}
function show(result) {
  finish(); facts = (result && result.facts || []).slice(0,6); searchHtml = result.searchHtml || '';
  $('heading').textContent = facts.length ? 'Source-supported mentions' : 'No supported match';
  $('count').textContent = facts.length + (facts.length === 1 ? ' fact' : ' facts');
  $('note').textContent = facts.length ? 'Tap a card for evidence and sources.' : 'Try the full school name or add the other location clue.';
  if(!facts.length) { empty('No reliable result this time.', 'This does not mean no public mention exists. Try another school name or hometown.'); }
  else {
    const grid = node('div', undefined, 'cards');
    facts.forEach((f,i) => {
      const b = node('button', undefined, 'card'); b.type = 'button';
      b.append(node('span',f.category,'category'),node('span',f.value,'value'),node('span',f.date,'date'));
      b.onclick = () => openDetail(i); grid.append(b);
    });
    $('stage').replaceChildren(grid);
  }
  if(searchHtml) {
    const b = node('button','Google Search suggestions'); b.type = 'button';
    b.style.cssText = 'font-size:15px;min-height:44px;padding:8px 12px;margin-top:8px';
    b.onclick = () => openDetail(-1); $('note').replaceChildren(document.createTextNode(facts.length ? 'Tap a card for evidence. ' : 'No supported facts. '),b);
  }
}
$('form').onsubmit = event => {
  event.preventDefault(); if(busy) return;
  const input = {name:$('name').value.trim(),school:$('school').value.trim(),hometown:$('hometown').value.trim()};
  if(input.name.split(/\s+/).length < 2 || (!input.school && !input.hometown)) {
    empty('Add one more clue.', 'Enter a full name and either a school or hometown.'); return;
  }
  facts=[]; searchHtml=''; setBusy(true); started=Date.now();
  $('heading').textContent='Searching public sources'; $('count').textContent='Working';
  empty('Looking for a clear match.', 'Searching published mentions and checking citation links.', true);
  $('note').textContent='This can take a minute or two.';
  timer=setInterval(() => { const seconds=Math.floor((Date.now()-started)/1000); $('count').textContent=seconds+'s';
    if(seconds>90) $('note').textContent='Still waiting for Google. Keep this page open.';
  },1000);
  if(!(window.google && google.script && google.script.run)) { fail({message:'Open the deployed Apps Script URL to run a live search.'}); return; }
  google.script.run.withSuccessHandler(show).withFailureHandler(fail).lookupPerson(input);
};
function openDetail(index) {
  if($('overlay').hidden) lastFocus=document.activeElement;
  selected=index; const body=$('detail'); body.replaceChildren();
  if(index>=0) {
    const f=facts[index]; $('detailTitle').textContent=f.category;
    body.append(node('h3',f.value),node('p',f.date),node('small','Match evidence'),node('p',f.match),
      node('small','Citation-linked AI summary · not a source quotation'),node('p',f.evidence));
    f.sources.forEach(s => { if(!/^https:\/\//i.test(s.url)) return; const a=node('a','Open source · '+s.title,'source'); a.href=s.url; a.target='_blank'; a.rel='noopener noreferrer'; body.append(a); });
  } else {
    $('detailTitle').textContent='Google Search';
    body.append(node('p','Search suggestions returned by Google.'));
    const frame=document.createElement('iframe'); frame.title='Google Search suggestions';
    frame.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox'); frame.srcdoc=searchHtml; body.append(frame);
  }
  $('previous').disabled=index<=0; $('next').disabled=index<0 || index>=facts.length-1;
  $('position').textContent=index<0?'Search suggestions':(index+1)+' / '+facts.length+' · Swipe to browse';
  $('overlay').hidden=false; body.scrollTop=0; $('close').focus();
}
function closeDetail() { $('overlay').hidden=true; if(lastFocus) lastFocus.focus(); }
$('close').onclick=closeDetail;
$('previous').onclick=()=>{if(selected>0)openDetail(selected-1);};
$('next').onclick=()=>{if(selected>=0 && selected<facts.length-1)openDetail(selected+1);};
$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDetail();};
document.addEventListener('keydown',e=>{
  if($('overlay').hidden)return;
  if(e.key==='Escape')closeDetail();
  if(e.key==='ArrowRight')$('next').click(); if(e.key==='ArrowLeft')$('previous').click();
  if(e.key==='Tab') {
    const items=Array.from($('overlay').querySelectorAll('button:not(:disabled),a,iframe'));
    const first=items[0],last=items[items.length-1];
    if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
  }
});
let touch=null;
document.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
document.addEventListener('touchend',e=>{
  if(!touch || !e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y; touch=null;
  if(!$('overlay').hidden && Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5) { if(dx<0)$('next').click();else $('previous').click(); }
},{passive:true});
$('reset').onclick=()=>{
  if(busy)return; $('form').reset();facts=[];searchHtml='';closeDetail();
  $('heading').textContent='Public record, small details.'; $('count').textContent='Up to 6 facts';
  $('note').textContent='Dated mentions, with sources you can open.';
  empty('Start with a name.', 'Add a school or hometown. We’ll look for a small number of useful, sourced details.');
};
$('reset').click();
</script>
</body>
</html>
