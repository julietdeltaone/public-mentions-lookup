:root{--muted:#aebccc;--line:#c5ddff24;--blue:#bce8ff}

</style></head><body>
<div class="app">
<header><div><h1>Public Mentions</h1><p class="muted">Quick lookup · one focused pass</p></div><button id="reset">New search</button></header>
<main><section class="search glass"><form id="form">
<div><label for="name">Full name</label><input id="name" required maxlength="120" placeholder="First and last name" autocomplete="off"></div>
<div><label for="school">School · tap to select or clear</label><div class="schools">
<button type="button" data-school="Clarkson University" aria-pressed="false">Clarkson</button><button type="button" data-school="SUNY Potsdam" aria-pressed="false">SUNY Potsdam</button><button type="button" data-school="SUNY Canton" aria-pressed="false">SUNY Canton</button><button type="button" data-school="St. Lawrence University" aria-pressed="false">St. Lawrence</button>
</div><input id="school" maxlength="120" placeholder="Or type another school" autocomplete="off"></div>
<div><label for="city">Hometown · city and state</label><div class="city"><input id="city" maxlength="120" placeholder="City / town" autocomplete="off"><select id="state" aria-label="Hometown state: New York first, bordering states next"><option value="NY">NY</option><option value="VT">VT</option><option value="MA">MA</option><option value="CT">CT</option><option value="NJ">NJ</option><option value="PA">PA</option><option value="NH">NH</option><option value="RI">RI</option><option value="ME">ME</option></select></div></div>
<button class="primary" id="search">Find mentions</button><p class="muted">Aim: 25s · stop waiting at 30s.<br>Add a school or city. NY alone is not a clue.</p>
</form></section>
<section class="results glass" aria-busy="false"><div class="row"><h2 id="heading">A name and one clue.</h2><span id="clock" class="muted">Up to 6</span></div><div class="progress"><i id="progress"></i></div><div id="stage" class="stage" aria-live="polite"></div><div class="row bottom"><p id="note" class="muted">Supported and possible matches stay distinct.</p><button id="suggestions" hidden>Google Search</button></div></section></main>
<footer><button id="tokensButton"><small>Last request · tokens</small><strong id="tokens">Not measured yet</strong></button><button id="costButton"><small>Last request · est. cost</small><strong id="cost">Not measured yet</strong></button><button id="budgetButton"><small id="budgetLabel">$5 tracker · not Google balance</small><strong id="balance">Loading usage…</strong><meter id="meter" min="0" max="5" value="5" aria-label="Estimated tracked budget remaining"></meter></button></footer>
</div>
<div class="overlay" id="overlay" hidden><section class="dialog glass" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="row"><h2 id="detailTitle">Details</h2><button id="close">Close</button></div><div id="detail" class="content"></div><div class="row" id="navigation"><button id="previous">Previous</button><span id="position" class="muted"></span><button id="next">Next</button></div></section></div>
<script>
const $=id=>document.getElementById(id), money=n=>'$'+Number(n).toFixed(4);
let facts=[],searchHtml='',selected=-1,ledger=null,busy=false,serial=0,active=null,focusBefore=null,budget=5;
try{budget=Number(localStorage.getItem('mentionsBudget'))||5;}catch(_){}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function empty(title,text,spin){const n=el('div',undefined,'empty');n.append(el('div',spin?'◌':'⌕','symbol'+(spin?' spin':'')),el('h3',title),el('p',text));$('stage').replaceChildren(n);}
function schoolButtons(){document.querySelectorAll('[data-school]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.school===$('school').value)));}
document.querySelectorAll('[data-school]').forEach(b=>b.onclick=()=>{$('school').value=$('school').value===b.dataset.school?'':b.dataset.school;schoolButtons();});$('school').oninput=schoolButtons;
function controls(value){busy=value;document.querySelectorAll('#form input,#form select,#form button').forEach(n=>n.disabled=value);$('reset').disabled=value;document.querySelector('.results').setAttribute('aria-busy',String(value));}
function stop(run){clearTimeout(run.timeout);clearInterval(run.interval);run.done=true;if(active===run)controls(false);}
function cutoff(run){if(run.done)return;stop(run);$('heading').textContent='Stopped waiting at 30s';$('clock').textContent='30s';$('progress').style.width='100%';empty('No result within the time limit.','Google may still finish and charge for the request. Late results will not appear.');$('note').textContent='No retry was sent. Any late token usage will update below.';}
function applyLedger(value){if(!value || (ledger && value.version<ledger.version))return;ledger=value;paintUsage();}
function paintUsage(){$('budgetLabel').textContent='$'+budget+' tracker · not Google balance';if(!ledger)return;const u=ledger.last; $('tokens').textContent=u?u.tokens.toLocaleString():'Not reported';$('cost').textContent=u?money(u.tokenCost)+'–'+money(u.tokenCost+u.searchEstimate):'Unknown';const remaining=Math.max(0,budget-ledger.tokenCost-ledger.searchEstimate);$('balance').textContent='$'+remaining.toFixed(2)+' est. remaining'+(ledger.pending||ledger.unknown?' *':'');$('meter').max=budget;$('meter').value=remaining;}
function clearView(){facts=[];searchHtml='';$('suggestions').hidden=true;$('progress').style.width='0%';}
$('reset').onclick=()=>{if(busy)return;serial++;active=null;$('form').reset();schoolButtons();clearView();$('heading').textContent='A name and one clue.';$('clock').textContent='Up to 6';$('note').textContent='Supported and possible matches stay distinct.';empty('Start with a name.','Tap a local school, or add a hometown. One strong new detail is enough.');};
$('form').onsubmit=e=>{
 e.preventDefault();if(busy)return;const q={name:$('name').value.trim(),school:$('school').value.trim(),city:$('city').value.trim(),state:$('state').value};
 if(q.name.split(/\s+/).length<2||(!q.school&&!q.city)){empty('Add a little context.','Enter a full name and a school or city.');return;}
 clearView();controls(true);const run={id:++serial,start:performance.now(),done:false};active=run;q.deadline=Date.now()+30000;
 $('heading').textContent='Searching public mentions';$('clock').textContent='0 / 30s';$('note').textContent='One narrow pass; no follow-up searches or automatic retries.';empty('Looking for one useful detail.','Results may be supported, possible, or unavailable.',true);
 run.timeout=setTimeout(()=>cutoff(run),30000);run.interval=setInterval(()=>{const ms=performance.now()-run.start;if(ms>=30000){cutoff(run);return;}$('clock').textContent=Math.floor(ms/1000)+' / 30s';$('progress').style.width=(ms/300)+'%';},200);
 if(!(window.google&&google.script&&google.script.run)){finishError(run,'Open the deployed Apps Script URL to search.');return;}
 google.script.run.withSuccessHandler(r=>{
   applyLedger(r.ledger);
   if(run.id!==serial)return;
   if(run.done||performance.now()-run.start>=30000||r.expired){cutoff(run);$('note').textContent='Google finished late. Usage updated; results discarded. You can search again.';return;}
   stop(run);$('clock').textContent=((performance.now()-run.start)/1000).toFixed(1)+'s';
   if(r.error){$('heading').textContent='Search unavailable';empty('No result this time.',r.error);return;}
   facts=r.facts||[];searchHtml=r.searchHtml||'';$('suggestions').hidden=!searchHtml;
   const supported=facts.filter(f=>f.status==='SUPPORTED').length;
   $('heading').textContent=supported+' supported · '+(facts.length-supported)+' possible';$('note').textContent=r.note;
   if(!facts.length){empty('No clear match in this pass.','A shallow search trades coverage for speed. Try a more specific school or town.');return;}
   const grid=el('div',undefined,'cards');facts.forEach((f,i)=>{const b=el('button',undefined,'card'+(f.status==='POSSIBLE'?' possible':''));const top=el('div',undefined,'card-top');top.append(el('span',f.category,'category'),el('span',f.status==='POSSIBLE'?'Possible':'Supported','status'));const bottom=el('div',undefined,'card-bottom');bottom.append(el('span',f.date,'date'),el('span','↗','open-mark'));b.append(top,el('span',f.value,'value'),bottom);b.setAttribute('aria-label',(f.status==='POSSIBLE'?'Possible match: ':'Source-supported: ')+f.value+'. Open evidence');b.onclick=()=>detail(i);grid.append(b);});$('stage').replaceChildren(grid);
 }).withFailureHandler(err=>{finishError(run,err.message||String(err));refreshUsage();}).lookupPerson(q);
};
function finishError(run,message){if(run.id!==serial)return;if(run.done||performance.now()-run.start>=30000){cutoff(run);return;}stop(run);$('heading').textContent='Search unavailable';empty('No result this time.',message);$('note').textContent='No automatic retry. Inputs are preserved.';}
function refreshUsage(){if(window.google&&google.script&&google.script.run)google.script.run.withSuccessHandler(applyLedger).withFailureHandler(()=>{$('balance').textContent='Usage unavailable';}).getLookupUsage();else $('balance').textContent='Open deployed app';}
function openPanel(title){if($('overlay').hidden)focusBefore=document.activeElement;$('detailTitle').textContent=title;$('detail').replaceChildren();$('overlay').hidden=false;$('close').focus();$('detail').scrollTop=0;}
function detail(i){selected=i;const f=facts[i];openPanel(f.status==='POSSIBLE'?'Possible match · not confirmed':'Source-supported · AI matched');$('navigation').hidden=false;const d=$('detail');d.append(el('h3',f.value),el('p',f.date),el('small',f.status==='POSSIBLE'?'Identity match · uncertain':'Identity match · source-supported'),el('p',f.match),el('small','Citation-linked AI summary, not a source quotation'),el('p',f.evidence));f.sources.forEach(s=>{if(!/^https:\/\//i.test(s.url))return;const a=el('a','Open source · '+s.title,'source');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';d.append(a);});$('position').textContent=(i+1)+' / '+facts.length+' · Swipe';$('previous').disabled=i===0;$('next').disabled=i===facts.length-1;}
$('previous').onclick=()=>{if(selected>0)detail(selected-1);};$('next').onclick=()=>{if(selected>=0&&selected<facts.length-1)detail(selected+1);};
$('suggestions').onclick=()=>{selected=-1;openPanel('Google Search suggestions');$('navigation').hidden=true;const f=document.createElement('iframe');f.title='Google Search suggestions';f.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox');f.srcdoc=searchHtml;$('detail').append(f);};
function usagePanel(){selected=-1;openPanel('Usage & cost estimates');$('navigation').hidden=true;const d=$('detail');d.append(el('p','Tokens are reported by Google after completion, including thinking tokens. Cost is estimated, not a bill. No live token count is available during the request.'));
 if(ledger){const u=ledger.last;if(u)d.append(el('p','Last: '+u.input+' input/tool tokens, '+u.output+' output/thinking tokens; '+u.queries+' reported search queries.'));d.append(el('p','Tracked: '+ledger.attempts+' attempts; '+ledger.tokens+' reported tokens. Estimated spend '+money(ledger.tokenCost)+'–'+money(ledger.tokenCost+ledger.searchEstimate)+'.'),el('p',ledger.unknown+' attempts have unknown cost. '+(ledger.pending?'One request is still pending.':'')),el('p','Tracking began '+new Date(ledger.since).toLocaleString()+'. Earlier tests, other apps, taxes and account-wide usage are excluded.'));}
 d.append(el('p','Range assumes either search allowance covers queries or each reported query costs $0.014. Query metadata may not equal billable searches, so this is not a guaranteed ceiling. Gemini 3.8 Flash tokens: $0.75/M input and $3.75/M output through Dec 31, 2026; $1.50/$7.50 afterward.'),el('p','The browser stops waiting at 30 seconds. Apps Script cannot cancel a Google request already running; late usage is still tracked.'));
 const label=el('label','Tracker starting budget ($)');label.htmlFor='budget';const input=el('input');input.id='budget';input.type='number';input.min='.01';input.step='.01';input.value=budget;const save=el('button','Save tracker budget');save.onclick=()=>{const n=Number(input.value);if(!Number.isFinite(n)||n<=0)return;budget=n;try{localStorage.setItem('mentionsBudget',String(n));}catch(_){}paintUsage();closePanel();};d.append(label,input,save);const a=el('a','Open Google usage and billing','source');a.href='https://aistudio.google.com/usage';a.target='_blank';a.rel='noopener noreferrer';d.append(a);}
['tokensButton','costButton','budgetButton'].forEach(id=>$(id).onclick=usagePanel);
function closePanel(){$('overlay').hidden=true;if(focusBefore)focusBefore.focus();}$('close').onclick=closePanel;$('overlay').onclick=e=>{if(e.target===$('overlay'))closePanel();};
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')closePanel();if(selected>=0&&e.key==='ArrowLeft')$('previous').click();if(selected>=0&&e.key==='ArrowRight')$('next').click();if(e.key==='Tab'){const a=[...$('overlay').querySelectorAll('button:not(:disabled),a,input,iframe')].filter(n=>n.getClientRects().length);const first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
let touch;document.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});document.addEventListener('touchcancel',()=>touch=null,{passive:true});document.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(!$('overlay').hidden&&selected>=0&&Math.abs(dx)>70&&Math.abs(dx)>1.5*Math.abs(dy))$(dx<0?'next':'previous').click();},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active&&!active.done&&performance.now()-active.start>=30000)cutoff(active);});
$('reset').click();refreshUsage();
</script></body></html>
